name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Validate entries
        run: npm run check
      - name: Check generated files are committed
        run: git diff --exit-code catalog.json index.md THIRD_PARTY.md gallery.html worker/src/data.json
      - name: Check Worker syntax
        run: node --check worker/src/index.js && node --check worker/src/mcp.js && node --check worker/src/search.js
      - name: Test Worker
        run: npm run test:worker
      - name: Install site dependencies
        run: npm ci
        working-directory: site
      - name: Build site
        run: npm run build
        working-directory: site
