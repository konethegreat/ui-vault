name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Validate entries
        run: npm run check
      - name: Install site dependencies
        run: npm ci
        working-directory: site
      - name: Build site
        run: npm run build
        working-directory: site
